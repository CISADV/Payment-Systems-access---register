<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SEPA Payment Systems: Direct & Indirect Participants</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 2rem; }
    .header { margin-bottom: 2rem; border-bottom: 1px solid #334155; padding-bottom: 1rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 1.25rem; }
    .badge { display: inline-block; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: bold; margin-bottom: 0.5rem; }
    .badge-FR { background: #bfdbfe; color: #1e40af; }
    .badge-LT { background: #fef08a; color: #854d0e; }
    .badge-DE { background: #fecaca; color: #991b1b; }
    .badge-LV { background: #fed7aa; color: #9a3412; }
    .tag-access { background: #065f46; color: #a7f3d0; margin-top: 0.5rem; font-size: 0.8rem; padding: 0.2rem 0.4rem; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Direct and indirect participants to SEPA payment systems</h1>
    <p id="meta-info">Loading registry data...</p>
  </div>
  <div class="grid" id="registry-grid"></div>

  <script>
    fetch('data.json')
      .then(res => res.json())
      .then(data => {
        document.getElementById('meta-info').innerText = 
          `Last update: ${data.last_update} | Total institutions: ${data.total_count}`;
        
        const grid = document.getElementById('registry-grid');
        grid.innerHTML = data.institutions.map(inst => `
          <div class="card">
            <span class="badge badge-${inst.Pays_Autorite}">${inst.Pays_Autorite}</span>
            <h3 style="margin: 0.2rem 0;">${inst.Nom_Etablissement}</h3>
            <p style="color:#94a3b8; font-size:0.9rem;">${inst.Type_Agrement}</p>
            <p><strong>BIC:</strong> ${inst.Code_BIC || 'N/A'}</p>
            <div class="tag-access">⚡ Access: ${inst.Acces_Direct_SEPA}</div>
          </div>
        `).join('');
      })
      .catch(err => {
        document.getElementById('meta-info').innerText = "Please wait while the registry data is generated for the first time...";
      });
  </script>
</body>
</html>
