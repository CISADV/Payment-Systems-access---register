YAML
name: Mise a jour automatique

on:
  schedule:
    - cron: '0 6 * * 1' # Chaque lundi
  workflow_dispatch: # Bouton pour exécuter manuellement

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas requests
      - run: python update_registry.py
      - name: Sauvegarder data.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Mise à jour data.json" || exit 0
          git push
